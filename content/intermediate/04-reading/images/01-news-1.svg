<rect x="240.0" y="272" width="320" height="54" rx="12" fill="#5E8FE0"/><text x="400.0" y="306.2" text-anchor="middle" font-size="20" fill="#FFF" font-weight="bold">세부 내용 · 인용</text>
<rect x="290.0" y="336" width="220" height="54" rx="12" fill="#8FB0EA"/><text x="400.0" y="370.2" text-anchor="middle" font-size="20" fill="#FFF" font-weight="bold">전망</text>
