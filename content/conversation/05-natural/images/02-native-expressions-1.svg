<rect x="40" y="247" width="320" height="54" rx="12" fill="#FFFFFF" stroke="#C9B8A8" stroke-width="3"/><text x="200.0" y="281.2" text-anchor="middle" font-size="20" fill="#555">I am very tired.</text>
<line x1="370" y1="274" x2="430" y2="274" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<rect x="440" y="247" width="320" height="54" rx="12" fill="#E8833A"/><text x="600.0" y="281.56" text-anchor="middle" font-size="21" fill="#FFF" font-weight="bold">I'm exhausted.</text>
<rect x="40" y="313" width="320" height="54" rx="12" fill="#FFFFFF" stroke="#C9B8A8" stroke-width="3"/><text x="200.0" y="347.2" text-anchor="middle" font-size="20" fill="#555">It is not important.</text>
