<rect x="440" y="313" width="320" height="54" rx="12" fill="#E8833A"/><text x="600.0" y="347.56" text-anchor="middle" font-size="21" fill="#FFF" font-weight="bold">No big deal.</text>
<rect x="40" y="379" width="320" height="54" rx="12" fill="#FFFFFF" stroke="#C9B8A8" stroke-width="3"/><text x="200.0" y="413.2" text-anchor="middle" font-size="20" fill="#555">Let's begin.</text>
