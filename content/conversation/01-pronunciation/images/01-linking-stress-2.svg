<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="NanumBarunGothic, NanumGothic, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker></defs>
<rect width="800" height="400" fill="#FFF6EE"/>
<text x="400.0" y="48" text-anchor="middle" font-size="30" font-weight="bold" fill="#7A4A22">연음: 단어와 단어가 붙는다</text>
<rect x="40" y="90" width="230" height="70" rx="12" fill="#E8833A"/><text x="155.0" y="133.64" text-anchor="middle" font-size="24" fill="#FFF" font-weight="bold">check it out</text>
<line x1="280" y1="125" x2="330" y2="125" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<rect x="340" y="90" width="420" height="70" rx="12" fill="#FFFFFF" stroke="#E8833A" stroke-width="3"/><text x="550.0" y="119.19999999999999" text-anchor="middle" font-size="20" fill="#333">체-킷-아웃 → 체키라웃</text><text x="550.0" y="145.2" text-anchor="middle" font-size="20" fill="#333">자음 + 모음이 이어진다</text>
<rect x="40" y="180" width="230" height="70" rx="12" fill="#E8833A"/><text x="155.0" y="223.64" text-anchor="middle" font-size="24" fill="#FFF" font-weight="bold">want to</text>
<line x1="280" y1="215" x2="330" y2="215" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<rect x="340" y="180" width="420" height="70" rx="12" fill="#FFFFFF" stroke="#E8833A" stroke-width="3"/><text x="550.0" y="209.2" text-anchor="middle" font-size="20" fill="#333">원트 투 → 워너</text><text x="550.0" y="235.2" text-anchor="middle" font-size="20" fill="#333">자주 쓰는 말은 줄어든다</text>
<rect x="40" y="270" width="230" height="70" rx="12" fill="#E8833A"/><text x="155.0" y="313.64" text-anchor="middle" font-size="24" fill="#FFF" font-weight="bold">next day</text>
<line x1="280" y1="305" x2="330" y2="305" stroke="#555" stroke-width="3" marker-end="url(#a)"/>
<rect x="340" y="270" width="420" height="70" rx="12" fill="#FFFFFF" stroke="#E8833A" stroke-width="3"/><text x="550.0" y="299.2" text-anchor="middle" font-size="20" fill="#333">넥스트 데이 → 넥스데이</text><text x="550.0" y="325.2" text-anchor="middle" font-size="20" fill="#333">같은·비슷한 자음은 한 번만</text>
<text x="400" y="375" text-anchor="middle" font-size="18" fill="#5B6B7A">한글 표기는 대략의 소리입니다. 음성을 듣고 따라 하세요.</text>
</svg>
