<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" font-family="NanumBarunGothic, NanumGothic, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker></defs>
<rect width="800" height="470" fill="#FFF6EE"/>
<text x="400.0" y="48" text-anchor="middle" font-size="30" font-weight="bold" fill="#7A4A22">헷갈리기 쉬운 소리 짝</text>
<rect x="30" y="80" width="150" height="62" rx="12" fill="#E8833A"/><text x="105.0" y="118.56" text-anchor="middle" font-size="21" fill="#FFF" font-weight="bold">R / L</text>
<rect x="195" y="80" width="150" height="62" rx="12" fill="#FFFFFF" stroke="#E8833A" stroke-width="3"/><text x="270.0" y="117.84" text-anchor="middle" font-size="19" fill="#222" font-weight="bold">rice 쌀</text>
<rect x="355" y="80" width="150" height="62" rx="12" fill="#FFFFFF" stroke="#3D7BD9" stroke-width="3"/><text x="430.0" y="117.84" text-anchor="middle" font-size="19" fill="#222" font-weight="bold">lice 이</text>
<text x="520" y="118" text-anchor="start" font-size="17" fill="#333">R은 혀를 말고 어디에도 닿지 않게</text>
<rect x="30" y="154" width="150" height="62" rx="12" fill="#E8833A"/><text x="105.0" y="192.56" text-anchor="middle" font-size="21" fill="#FFF" font-weight="bold">F / P</text>
<rect x="195" y="154" width="150" height="62" rx="12" fill="#FFFFFF" stroke="#E8833A" stroke-width="3"/><text x="270.0" y="191.84" text-anchor="middle" font-size="19" fill="#222" font-weight="bold">fan 선풍기</text>
<rect x="355" y="154" width="150" height="62" rx="12" fill="#FFFFFF" stroke="#3D7BD9" stroke-width="3"/><text x="430.0" y="191.84" text-anchor="middle" font-size="19" fill="#222" font-weight="bold">pan 팬</text>
<text x="520" y="192" text-anchor="start" font-size="17" fill="#333">F는 윗니를 아랫입술에 대고 바람</text>
<rect x="30" y="228" width="150" height="62" rx="12" fill="#E8833A"/><text x="105.0" y="266.56" text-anchor="middle" font-size="21" fill="#FFF" font-weight="bold">V / B</text>
<rect x="195" y="228" width="150" height="62" rx="12" fill="#FFFFFF" stroke="#E8833A" stroke-width="3"/><text x="270.0" y="265.84" text-anchor="middle" font-size="19" fill="#222" font-weight="bold">vest 조끼</text>
<rect x="355" y="228" width="150" height="62" rx="12" fill="#FFFFFF" stroke="#3D7BD9" stroke-width="3"/><text x="430.0" y="265.84" text-anchor="middle" font-size="19" fill="#222" font-weight="bold">best 최고의</text>
<text x="520" y="266" text-anchor="start" font-size="17" fill="#333">V는 F처럼 대고 목을 울린다</text>
<rect x="30" y="302" width="150" height="62" rx="12" fill="#E8833A"/><text x="105.0" y="340.56" text-anchor="middle" font-size="21" fill="#FFF" font-weight="bold">TH / S</text>
<rect x="195" y="302" width="150" height="62" rx="12" fill="#FFFFFF" stroke="#E8833A" stroke-width="3"/><text x="270.0" y="339.84" text-anchor="middle" font-size="19" fill="#222" font-weight="bold">think 생각하다</text>
<rect x="355" y="302" width="150" height="62" rx="12" fill="#FFFFFF" stroke="#3D7BD9" stroke-width="3"/><text x="430.0" y="339.84" text-anchor="middle" font-size="19" fill="#222" font-weight="bold">sink 싱크대</text>
<text x="520" y="340" text-anchor="start" font-size="17" fill="#333">TH는 혀끝을 이 사이로 살짝</text>
<rect x="30" y="376" width="150" height="62" rx="12" fill="#E8833A"/><text x="105.0" y="414.56" text-anchor="middle" font-size="21" fill="#FFF" font-weight="bold">짧은 i / 긴 ee</text>
<rect x="195" y="376" width="150" height="62" rx="12" fill="#FFFFFF" stroke="#E8833A" stroke-width="3"/><text x="270.0" y="413.84" text-anchor="middle" font-size="19" fill="#222" font-weight="bold">ship 배</text>
<rect x="355" y="376" width="150" height="62" rx="12" fill="#FFFFFF" stroke="#3D7BD9" stroke-width="3"/><text x="430.0" y="413.84" text-anchor="middle" font-size="19" fill="#222" font-weight="bold">sheep 양</text>
<text x="520" y="414" text-anchor="start" font-size="17" fill="#333">ship은 짧고 힘을 빼서</text>
</svg>
