<text x="440" y="380" text-anchor="start" font-size="24" fill="#222" font-weight="bold">Where are you going?</text>
<path d="M440 326 Q560 318 640 328 Q690 336 715 356" fill="none" stroke="#3D7BD9" stroke-width="5" marker-end="url(#a)"/>
<text x="580" y="415" text-anchor="middle" font-size="19" fill="#5B6B7A">끝을 내린다 ↘</text>
<line x1="400" y1="320" x2="400" y2="420" stroke="#E0CDBB" stroke-width="2"/>
