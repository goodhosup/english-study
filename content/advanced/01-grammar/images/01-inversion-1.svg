<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="NanumBarunGothic, NanumGothic, sans-serif">
  <rect width="800" height="420" fill="#F7F3FD"/>
  <text x="400" y="50" text-anchor="middle" font-size="30" font-weight="bold" fill="#4B2A86">부정어가 앞으로 오면 조동사가 주어 앞으로</text>
  <text x="50" y="110" font-size="22" font-weight="bold" fill="#333">평서문</text>
  <g font-size="24" text-anchor="middle">
    <rect x="50" y="125" width="110" height="64" rx="12" fill="#FFF" stroke="#999" stroke-width="2"/><text x="105" y="166" fill="#222">I</text>
    <rect x="175" y="125" width="130" height="64" rx="12" fill="#7B4FC9"/><text x="240" y="166" fill="#FFF" font-weight="bold">have</text>
    <rect x="320" y="125" width="140" height="64" rx="12" fill="#E8833A"/><text x="390" y="166" fill="#FFF" font-weight="bold">never</text>
    <rect x="475" y="125" width="275" height="64" rx="12" fill="#FFF" stroke="#999" stroke-width="2"/><text x="612" y="166" fill="#222">seen such a mess.</text>
  </g>
  <path d="M390 200 C390 240, 120 230, 120 262" fill="none" stroke="#E8833A" stroke-width="4" stroke-dasharray="8 6"/>
  <path d="M240 200 C240 230, 270 240, 270 262" fill="none" stroke="#7B4FC9" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="50" y="250" font-size="22" font-weight="bold" fill="#333">도치문</text>
  <g font-size="24" text-anchor="middle">
    <rect x="50" y="275" width="140" height="64" rx="12" fill="#E8833A"/><text x="120" y="316" fill="#FFF" font-weight="bold">Never</text>
    <rect x="205" y="275" width="130" height="64" rx="12" fill="#7B4FC9"/><text x="270" y="316" fill="#FFF" font-weight="bold">have</text>
    <rect x="350" y="275" width="110" height="64" rx="12" fill="#FFF" stroke="#999" stroke-width="2"/><text x="405" y="316" fill="#222">I</text>
    <rect x="475" y="275" width="275" height="64" rx="12" fill="#FFF" stroke="#999" stroke-width="2"/><text x="612" y="316" fill="#222">seen such a mess.</text>
  </g>
  <g font-size="19">
    <rect x="50" y="365" width="22" height="22" rx="4" fill="#E8833A"/><text x="82" y="383" fill="#333">부정어 (never, rarely, not only ...)</text>
    <rect x="450" y="365" width="22" height="22" rx="4" fill="#7B4FC9"/><text x="482" y="383" fill="#333">조동사 (have, do, can ...)</text>
  </g>
</svg>
