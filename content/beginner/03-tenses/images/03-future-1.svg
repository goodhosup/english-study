<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="NanumBarunGothic, NanumGothic, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#555"/></marker></defs>
<rect width="800" height="430" fill="#F4FBF6"/>
<text x="400" y="48" text-anchor="middle" font-size="30" font-weight="bold" fill="#1F5F3A">언제 결정했나요?</text>
<rect x="50" y="80" width="330" height="320" rx="20" fill="#FFF" stroke="#E8833A" stroke-width="3"/>
<path d="M225 100 L180 170 L215 170 L195 210 L250 140 L215 140 L235 100 Z" fill="#E8833A"/>
<text x="215" y="235" text-anchor="middle" font-size="30" font-weight="bold" fill="#E8833A">will</text>
<text x="215" y="270" text-anchor="middle" font-size="20" fill="#555">말하는 순간 정한 일</text>
<text x="215" y="335" text-anchor="middle" font-size="19" fill="#222">The phone is ringing. I'll get it.</text>
<text x="215" y="365" text-anchor="middle" font-size="17" fill="#777">(지금 결정)</text>
<rect x="420" y="80" width="330" height="320" rx="20" fill="#FFF" stroke="#3D7BD9" stroke-width="3"/>
<rect x="555" y="105" width="110" height="95" rx="10" fill="#FFF" stroke="#3D7BD9" stroke-width="4"/><rect x="555" y="105" width="110" height="26" rx="8" fill="#3D7BD9"/><line x1="580" y1="98" x2="580" y2="115" stroke="#3D7BD9" stroke-width="5"/><line x1="640" y1="98" x2="640" y2="115" stroke="#3D7BD9" stroke-width="5"/><path d="M585 165 L603 183 L637 147" fill="none" stroke="#2E9E5B" stroke-width="7" stroke-linecap="round"/>
<text x="585" y="235" text-anchor="middle" font-size="30" font-weight="bold" fill="#3D7BD9">be going to</text>
<text x="585" y="270" text-anchor="middle" font-size="20" fill="#555">미리 세운 계획</text>
<text x="585" y="335" text-anchor="middle" font-size="19" fill="#222">We're going to buy a new car.</text>
<text x="585" y="365" text-anchor="middle" font-size="17" fill="#777">(이미 결정)</text>
</svg>